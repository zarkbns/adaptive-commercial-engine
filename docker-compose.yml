version: '3.8'

services:
  # Official HydraDB OSS Graph Substrate Instance
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: ace-hydradb-oss
    restart: unless-stopped

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    ports:
      - "8443:8443"
      - "9090:9090"
      - "7687:7687"

    environment:
      RUST_LOG: info
      RUST_MIN_STACK: "33554432"

      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store

      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0

      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687

      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token

      GRAPH_ALLOW_PLAINTEXT: "true"

    volumes:
      - ./hydradb-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1:9090\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Adaptive Commercial Engine (ACE) Application Service
  ace-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ace-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}

      HYDRADB_URL: ${HYDRADB_URL:-http://hydradb:8443}
      HYDRADB_ADMIN_URL: ${HYDRADB_ADMIN_URL:-http://hydradb:9090}

      HYDRADB_GRAPH_ID: ${HYDRADB_GRAPH_ID:-default}
      HYDRADB_NAMESPACE: ${HYDRADB_NAMESPACE:-default}
      HYDRADB_API_KEY: ${HYDRADB_API_KEY}
    depends_on:
      hydradb:
        condition: service_started
